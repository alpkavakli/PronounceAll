#
# The merge gate (NFR-OPS-08, SDD v1.1 §7.8). Runs on every push to any branch
# and every pull request against the default branch. Merge to `main` is blocked
# unless every job passes — configure that under branch protection, which lives
# in repository settings rather than in this file.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint and licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The C4 dependency direction and the NFR-SEC-07 parameterisation rule are
      # enforced here, not by review (§7.3, §7.4).
      - name: ESLint
        run: npm run lint

      # NFR-LEGAL-03: every .js, .mjs, .cjs, and .ejs file carries the header.
      - name: Licence headers
        run: npm run lint:licence

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: pronounceall
          MYSQL_USER: pronounceall_app
          MYSQL_PASSWORD: ci-app
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: pronounceall
      MYSQL_USER: pronounceall_app
      MYSQL_PASSWORD: ci-app
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Flyway owns schema migrations (C3). Host networking so the container
      # reaches the service container published on the runner.
      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/flyway/sql:ro" \
            flyway/flyway:11-alpine \
            -url="jdbc:mysql://127.0.0.1:3306/pronounceall?allowPublicKeyRetrieval=true&useSSL=false" \
            -user=root -password=ci-root -connectRetries=30 migrate

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: pronounceall
          MYSQL_USER: pronounceall_app
          MYSQL_PASSWORD: ci-app
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: pronounceall
      MYSQL_USER: pronounceall_app
      MYSQL_PASSWORD: ci-app
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/flyway/sql:ro" \
            flyway/flyway:11-alpine \
            -url="jdbc:mysql://127.0.0.1:3306/pronounceall?allowPublicKeyRetrieval=true&useSSL=false" \
            -user=root -password=ci-root -connectRetries=30 migrate

      # Multi-browser including WebKit for Safari, plus the no-JavaScript
      # profile that proves progressive enhancement (NFR-COMPAT-03, §7.8).
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # NFR-SEC-08: high threshold, production dependencies.
      - name: npm audit
        run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, per the NFR-SEC-06 criterion

      # NFR-SEC-06: no real secret value has ever been committed.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: pronounceall
          MYSQL_USER: pronounceall_app
          MYSQL_PASSWORD: ci-app
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: pronounceall
      MYSQL_USER: pronounceall_app
      MYSQL_PASSWORD: ci-app
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/flyway/sql:ro" \
            flyway/flyway:11-alpine \
            -url="jdbc:mysql://127.0.0.1:3306/pronounceall?allowPublicKeyRetrieval=true&useSSL=false" \
            -user=root -password=ci-root -connectRetries=30 migrate

      # NFR-PERF-03 and NFR-A11Y-02 both set a floor of 90.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:3000/
          startServerCommand: npm start
          startServerReadyPattern: listening
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
