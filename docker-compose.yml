#
# Local development topology. Production adds Nginx, Certbot, and the worker
# processes in front of and alongside this set (SDD v1.1 §3.2); those arrive
# with the deployment work rather than here.

services:
  mysql:
    image: mysql:8.4
    command:
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pronounceall}
      MYSQL_USER: ${MYSQL_USER:-pronounceall_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-devroot}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF persistence and noeviction, per V2: Redis memory is a monitored
    # signal, never something left to evict silently.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:11-alpine
    # Flyway owns schema migrations (C3). Run explicitly: `npm run migrate`.
    #
    # The connection settings are ENVIRONMENT variables rather than command
    # arguments on purpose. `docker compose run --rm flyway migrate` REPLACES a
    # service's `command`, so connection arguments placed there would be
    # discarded and Flyway would start unconfigured; environment variables
    # survive the override, so the same configuration serves `docker compose up`
    # and `docker compose run` alike.
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pronounceall}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: '30'
    command: ['migrate']
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    # DEVELOPMENT ONLY. A local SMTP catcher: verification and reset emails land
    # in its web inbox at http://localhost:8025 instead of being delivered. The
    # application sends through its SMTP adapter, so production points the same
    # code at a real relay; staging and production refuse to boot without SMTP
    # credentials (src/config). The production provider is not chosen here.
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

  app:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pronounceall}
      MYSQL_USER: ${MYSQL_USER:-pronounceall_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
      REDIS_URL: redis://redis:6379
      # Development mail goes to the Mailpit service; 127.0.0.1 inside this
      # container would be the container itself.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '3000:3000'
    # The generated audio store is not in the image (it is not source; see
    # .gitignore), so development mounts the local one read-only. Production
    # serves audio from its own volume through Nginx (V4).
    volumes:
      - ./data/audio:/app/data/audio:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The worker tier (SDD v1.1 §6.5, Threat Model F4): one process per database
  # principal (§4.9). Locally all three share the development user; in
  # production each sets MYSQL_USER to its own principal — the erasure worker
  # `pa_erase`, the maintenance worker `pa_maint`, the app worker `pa_app` —
  # and OPS_ALERT_EMAIL, without which a worker refuses to start there.
  # No HTTP server, so the image's /health check does not apply.
  worker-erasure:
    build: .
    command: ['node', 'src/workers/erasure.worker.js']
    environment: &worker-environment
      NODE_ENV: ${NODE_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pronounceall}
      MYSQL_USER: ${MYSQL_USER:-pronounceall_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-ops@pronounceall.localhost}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      disable: true
    depends_on: &worker-dependencies
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-maintenance:
    build: .
    command: ['node', 'src/workers/maintenance.worker.js']
    environment: *worker-environment
    healthcheck:
      disable: true
    depends_on: *worker-dependencies

  worker-app:
    build: .
    command: ['node', 'src/workers/app.worker.js']
    environment: *worker-environment
    healthcheck:
      disable: true
    depends_on: *worker-dependencies

  # The backup worker (NFR-OPS-01, V6), built from the MySQL image for its
  # mysqldump and the restore test's mysqld. Behind the `backup` profile, with
  # a local S3 stand-in, so a plain `docker compose up` neither backs up nor
  # needs a bucket: `docker compose --profile backup up -d`, then
  # `npm run backup:create-dev-bucket` once. Production points the BACKUP_S3_*
  # variables at Backblaze B2 and drops the stand-in.
  worker-backup:
    profiles: ['backup']
    build:
      context: .
      dockerfile: Dockerfile.backup
    environment:
      <<: *worker-environment
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://backup-s3:9000}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-pronounceall-backups}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-dev-backup-access}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-dev-backup-secret-not-a-secret}
      # Development objects stay deletable; production is COMPLIANCE (V6).
      BACKUP_OBJECT_LOCK_MODE: ${BACKUP_OBJECT_LOCK_MODE:-GOVERNANCE}
    depends_on:
      <<: *worker-dependencies
      backup-s3:
        condition: service_started

  # Development stand-in for Backblaze B2: RustFS (Apache-2.0), an
  # S3-compatible server with Object Lock and server-side encryption. Pinned by
  # digest; the credentials and key below are local placeholders, not secrets.
  backup-s3:
    profiles: ['backup']
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: dev-backup-access
      RUSTFS_SECRET_KEY: dev-backup-secret-not-a-secret
      RUSTFS_SSE_S3_MASTER_KEY: ZGV2LW9ubHktc3NlLWtleS1ub3QtYS1zZWNyZXQhISE=
    ports:
      - '9010:9000'
    volumes:
      - backup-s3-data:/data

volumes:
  backup-s3-data:
  mysql-data:
  redis-data:
